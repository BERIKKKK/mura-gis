<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80">
  <!-- QGIS parameterized SVG: 19th-century architectural monument -->

  <!-- Same outer marker -->
  <path d="M32 2
           C15.4 2 2 15.4 2 32
           C2 49.5 20.2 67.4 32 78
           C43.8 67.4 62 49.5 62 32
           C62 15.4 48.6 2 32 2Z"
        fill="param(fill) #A9683F"
        fill-opacity="param(fill-opacity) 1"
        stroke="param(outline) #542A17"
        stroke-opacity="param(outline-opacity) 1"
        stroke-width="param(outline-width) 2.8"
        stroke-linejoin="round"/>

  <!-- Same inner medallion -->
  <circle cx="32" cy="31.5" r="22.2"
          fill="#FFF2D5"
          stroke="param(outline) #542A17"
          stroke-width="2.2"/>

  <!-- 19th-century 2-storey facade -->
  <g fill="param(outline) #542A17">
    <!-- roof cornice -->
    <path d="M15 23 H49 V25 H15 Z"/>
    <!-- central decorative pediment -->
    <path d="M24 23 V20.5
             H27
             C27.8 17.8 29.5 16.5 32 16.5
             C34.5 16.5 36.2 17.8 37 20.5
             H40 V23 Z"/>
    <circle cx="32" cy="20" r="1.5" fill="#FFF2D5"/>

    <!-- building body -->
    <path d="M16 25 H48 V44 H16 Z"/>

    <!-- horizontal floor/cornice bands -->
    <rect x="15" y="31.5" width="34" height="1.8"/>
    <rect x="14.5" y="43" width="35" height="2"/>

    <!-- pilasters -->
    <rect x="17" y="25" width="2" height="18"/>
    <rect x="25" y="25" width="1.7" height="18"/>
    <rect x="38.3" y="25" width="1.7" height="18"/>
    <rect x="45" y="25" width="2" height="18"/>
  </g>

  <!-- upper arched windows -->
  <g fill="#FFF2D5">
    <path d="M20.3 28.3
             A2.2 2.2 0 0 1 24.7 28.3
             V31 H20.3 Z"/>
    <path d="M28.3 28.3
             A2.2 2.2 0 0 1 32.7 28.3
             V31 H28.3 Z"/>
    <path d="M35.3 28.3
             A2.2 2.2 0 0 1 39.7 28.3
             V31 H35.3 Z"/>
    <path d="M41.3 28.3
             A2.2 2.2 0 0 1 45.7 28.3
             V31 H41.3 Z"/>

    <!-- lower windows -->
    <path d="M20.5 36
             A2 2 0 0 1 24.5 36
             V41 H20.5 Z"/>
    <path d="M40.5 36
             A2 2 0 0 1 44.5 36
             V41 H40.5 Z"/>

    <!-- central entrance -->
    <path d="M28.5 44 V37.5
             A3.5 3.5 0 0 1 35.5 37.5
             V44 Z"/>
  </g>

  <!-- entrance split -->
  <path d="M32 38 V44"
        stroke="param(outline) #542A17"
        stroke-width="1.1"/>

  <!-- base -->
  <path d="M14 45.5 H50"
        stroke="param(outline) #542A17"
        stroke-width="2.4"
        stroke-linecap="round"/>
</svg>