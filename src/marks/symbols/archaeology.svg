<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80">
  <!-- QGIS parameterized SVG -->
  <!-- Outer map marker -->
  <path d="M32 2
           C15.4 2 2 15.4 2 32
           C2 49.5 20.2 67.4 32 78
           C43.8 67.4 62 49.5 62 32
           C62 15.4 48.6 2 32 2Z"
        fill="param(fill) #A9683F"
        fill-opacity="param(fill-opacity) 1"
        stroke="param(outline) #542A17"
        stroke-opacity="param(outline-opacity) 1"
        stroke-width="param(outline-width) 2.8"
        stroke-linejoin="round"/>

  <!-- Inner medallion -->
  <circle cx="32" cy="31.5" r="22.2"
          fill="#FFF2D5"
          stroke="param(outline) #542A17"
          stroke-width="2.2"/>

  <!-- Archaeological burial mound -->
  <path d="M13.5 39
           C17.3 33.2 23.7 27.6 32 27.6
           C40.3 27.6 46.7 33.2 50.5 39
           C44.2 35.9 38.2 34.4 32 34.4
           C25.8 34.4 19.8 35.9 13.5 39Z"
        fill="param(outline) #542A17"/>

  <!-- Stones on mound -->
  <path d="M25.2 28.2 L27 24.8 L30.5 24.1 L32.1 27.7Z"
        fill="param(outline) #542A17"/>
  <path d="M32.6 27.7 L35 24.3 L38.5 25.3 L40.1 29Z"
        fill="param(outline) #542A17"/>

  <!-- Mound inner layer -->
  <path d="M18 39
           C22.3 36.4 27 35.3 32 35.3
           C37 35.3 41.7 36.4 46 39"
        fill="none"
        stroke="#FFF2D5"
        stroke-width="1.8"
        stroke-linecap="round"/>

  <!-- Ground -->
  <path d="M12.5 41.5 H51.5"
        fill="none"
        stroke="param(outline) #542A17"
        stroke-width="2.5"
        stroke-linecap="round"/>
</svg>