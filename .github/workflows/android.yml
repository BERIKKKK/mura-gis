# Mura GIS Android — жұмыс үстелі нұсқасынан бөлек CI/CD.
#   • android/** өзгергенде: :core тестілері (жұмыс үстелі кодымен кросс-тексеру қоса), үлкен файл тесті, debug APK, lint.
#   • android/vX.Y.Z[-alpha.N] тегі жіберілгенде: қолтаңбалы release APK және GitHub Release (альфа/бета — pre-release).
# Жұмыс үстелінің release.yml-і тек v* тегтеріне іске қосылады — android/v* тегтері оған әсер етпейді.
name: Android

on:
  push:
    branches: ['**']
    paths: ['android/**', '.github/workflows/android.yml']
    tags: ['android/v*']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

defaults:
  run:
    working-directory: android

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Жұмыс үстелі кодымен (main/gpkg.js — node:sqlite) үйлесімділік тесттері үшін
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: gradle/actions/setup-gradle@v4

      - name: Нұсқа
        id: ver
        run: |
          echo "name=$(grep '^versionName=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "code=$(grep '^versionCode=' version.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: ":core тестілері"
        run: ./gradlew --no-daemon :core:test :core:largeFileTest

      - name: Debug APK
        run: ./gradlew --no-daemon :app:assembleDebug

      # APK — Lint-тен бұрын жүктеледі (Lint ескертулері сынақ жинағын бөгемейді)
      - uses: actions/upload-artifact@v4
        with:
          name: MuraGIS-Android-${{ steps.ver.outputs.name }}-debug
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Lint
        continue-on-error: true
        run: ./gradlew --no-daemon :app:lintDebug

      - name: Тест есептері
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            android/core/build/reports/tests/
            android/core/build/test-results/
            android/app/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/android/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Тег пен version.properties сәйкес пе
        id: ver
        run: |
          v=$(grep '^versionName=' version.properties | cut -d= -f2)
          tag="${GITHUB_REF_NAME#android/v}"
          if [ "$v" != "$tag" ]; then
            echo "::error::Тег android/v$tag, ал android/version.properties: $v — сәйкес емес."
            exit 1
          fi
          echo "name=$v" >> "$GITHUB_OUTPUT"
          case "$v" in *-*) echo "pre=true" >> "$GITHUB_OUTPUT";; *) echo "pre=false" >> "$GITHUB_OUTPUT";; esac

      - name: Қолтаңба кілті (құпиялардан)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 құпиясы жоқ. Settings → Secrets → Actions: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD (android/README.md)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Өзгерістер тізімі (CHANGELOG.md-ден)
        run: |
          awk -v v="${{ steps.ver.outputs.name }}" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          echo "" >> "$RUNNER_TEMP/notes.md"
          echo "Android нұсқасы жұмыс үстеліндегі Mura GIS-тен бөлек нұсқаланады." >> "$RUNNER_TEMP/notes.md"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Mura GIS Android ${{ steps.ver.outputs.name }}
          prerelease: ${{ steps.ver.outputs.pre }}
          make_latest: false
          body_path: ${{ runner.temp }}/notes.md
          files: android/app/build/outputs/apk/release/*.apk
