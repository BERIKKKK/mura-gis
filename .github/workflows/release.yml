# Mura GIS: Windows нұсқасын құрастырып, GitHub Releases бетіне жариялау.
# Іске қосылуы: v* тегі жіберілгенде (мыс. git tag v1.2.0 && git push origin v1.2.0)
# не Actions бетінен қолмен (Run workflow): таңдалған тармақтан (әдетте main) құрастырылады; тег әлі жоқ болса,
# workflow оны тармақтың соңғы коммитіне өзі жасайды.
# electron-builder орнатқыш (NSIS), портативті нұсқа және автоматты жаңартуға керек latest.yml файлын жүктейді.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Жарияланатын нұсқа тегі (мыс. v1.2.0) — package.json нұсқасымен сәйкес болуы керек'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Тег пен package.json нұсқасы сәйкес пе
        shell: bash
        run: |
          v=$(node -p "require('./package.json').version")
          if [ "v$v" != "$TAG" ]; then
            echo "::error::Тег $TAG, ал package.json нұсқасы $v — сәйкес емес. Алдымен package.json → version өзгертіңіз."
            exit 1
          fi

      - name: Тег жоқ болса — жасау (қолмен іске қосылғанда)
        shell: bash
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "Тег $TAG бар."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Mura GIS ${TAG#v}"
            git push origin "$TAG"
            echo "Тег $TAG жасалды: $(git rev-parse --short HEAD)"
          fi

      - run: npm ci

      - name: Маршрут желісінің тесті (routes/graph.js)
        shell: bash
        run: node scripts/test-graph.mjs

      - name: Құрастыру және жариялау
        run: node scripts/build-win.js --win --publish always   # NSIS-ке қазақ тілі қосылады (build/nsis-lang)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
