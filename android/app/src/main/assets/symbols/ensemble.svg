<svg xmlns="http://www.w3.org/2000/svg" width="64" height="80" viewBox="0 0 64 80">
<!-- QGIS parameterized SVG: heritage ensemble -->
<path d="M32 2C15.4 2 2 15.4 2 32C2 49.5 20.2 67.4 32 78C43.8 67.4 62 49.5 62 32C62 15.4 48.6 2 32 2Z"
 fill="param(fill) #A9683F" fill-opacity="param(fill-opacity) 1"
 stroke="param(outline) #542A17" stroke-opacity="param(outline-opacity) 1"
 stroke-width="param(outline-width) 2.8" stroke-linejoin="round"/>

<circle cx="32" cy="31.5" r="22.2" fill="#FFF2D5"
 stroke="param(outline) #542A17" stroke-width="2.2"/>

<!-- Ensemble: saganatam + mausoleum + gravestones -->
<g fill="param(outline) #542A17">

  <!-- left saganatam: low open-top funerary enclosure -->
  <path d="M13.5 39.5V32.5H16V37.5H23V32.5H25.5V39.5Z"/>
  <rect x="12.5" y="39.5" width="14" height="2" rx=".5"/>

  <!-- central mausoleum -->
  <path d="M26.5 41V28.5
           L28.5 27V23.5
           C28.5 20.8 30 19 32 18
           C34 19 35.5 20.8 35.5 23.5
           V27L37.5 28.5V41Z"/>
  <!-- mausoleum doorway -->
  <path d="M30 41V35.5
           A2 2 0 0 1 34 35.5
           V41Z" fill="#FFF2D5"/>
  <!-- mausoleum decorative band -->
  <rect x="27.3" y="29.5" width="9.4" height="1.5" fill="#FFF2D5"/>

  <!-- right gravestone 1 -->
  <path d="M40 40V31
           C40 28.8 41.3 27.2 43 26.5
           C44.7 27.2 46 28.8 46 31
           V40Z"/>
  <circle cx="43" cy="31" r="1.2" fill="#FFF2D5"/>

  <!-- right gravestone 2 -->
  <path d="M47 40V33
           C47 31.2 48.1 30 49.5 29.4
           C50.9 30 52 31.2 52 33
           V40Z"/>
  <path d="M48.4 34H50.6" stroke="#FFF2D5" stroke-width="1.1"/>

  <!-- small foreground gravestone -->
  <path d="M19 41V35.5
           C19 34.1 20 33 21.2 32.6
           C22.4 33 23.4 34.1 23.4 35.5
           V41Z"/>
</g>

<!-- common ground -->
<path d="M11.5 42.5H52.5"
 fill="none" stroke="param(outline) #542A17"
 stroke-width="2.4" stroke-linecap="round"/>
</svg>