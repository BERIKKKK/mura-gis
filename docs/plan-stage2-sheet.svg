<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 210 297" width="210mm" height="297mm" font-family="Arial, 'Segoe UI', sans-serif" fill="#111">
  <!-- «Жоспар», 2-кезең: жалпы жоспар бетінің макеті (docs/PLAN-STAGE2.md). Деректер ойдан алынған, масштабсыз мысал. -->
  <defs>
    <!-- Материалдар: ГОСТ 2.306-68 п. 2 бойынша қосымша белгілер (шартты белгілер блогында түсіндіріледі) -->
    <pattern id="m-fired" patternUnits="userSpaceOnUse" width="1.2" height="1.2" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="1.2" stroke="#111" stroke-width="0.2"/>
    </pattern>
    <pattern id="m-raw" patternUnits="userSpaceOnUse" width="2.4" height="2.4" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="2.4" stroke="#111" stroke-width="0.2" stroke-dasharray="0.9 0.6"/>
    </pattern>
    <pattern id="m-stone" patternUnits="userSpaceOnUse" width="1.6" height="1.6">
      <path d="M0 0L1.6 1.6M1.6 0L0 1.6" stroke="#111" stroke-width="0.16"/>
    </pattern>
    <!-- Контурсыз нысандардың белгілері (≈ 4 мм, орталығы 0,0) -->
    <symbol id="s-kulpytas" viewBox="-2 -2 4 4" overflow="visible"><path d="M-0.8 1.8V-1A0.8 0.8 0 0 1 0.8 -1V1.8Z" fill="#111"/></symbol>
    <symbol id="s-koitas" viewBox="-2 -2 4 4" overflow="visible"><rect x="-1.9" y="-0.75" width="3.8" height="1.5" rx="0.75" fill="#fff" stroke="#111" stroke-width="0.3"/></symbol>
    <symbol id="s-kesene" viewBox="-2 -2 4 4" overflow="visible"><rect x="-1.8" y="-1.8" width="3.6" height="3.6" fill="#fff" stroke="#111" stroke-width="0.4"/><circle r="1.1" fill="none" stroke="#111" stroke-width="0.25"/></symbol>
    <symbol id="s-sagana" viewBox="-2 -2 4 4" overflow="visible"><rect x="-1.9" y="-1.3" width="3.8" height="2.6" fill="#fff" stroke="#111" stroke-width="0.25"/><rect x="-1.3" y="-0.7" width="2.6" height="1.4" fill="none" stroke="#111" stroke-width="0.25"/></symbol>
    <symbol id="s-korshau" viewBox="-2 -2 4 4" overflow="visible"><rect x="-1.9" y="-1.3" width="3.8" height="2.6" fill="none" stroke="#111" stroke-width="0.3" stroke-dasharray="0.7 0.45"/></symbol>
    <symbol id="s-sandyktas" viewBox="-2 -2 4 4" overflow="visible"><rect x="-1.9" y="-1" width="3.8" height="2" fill="#fff" stroke="#111" stroke-width="0.3"/><line x1="-1.9" y1="0" x2="1.9" y2="0" stroke="#111" stroke-width="0.25"/></symbol>
    <symbol id="s-ushtas" viewBox="-2 -2 4 4" overflow="visible"><g fill="#111"><rect x="-1.7" y="-1" width="0.7" height="2" rx="0.3"/><rect x="-0.35" y="-1" width="0.7" height="2" rx="0.3"/><rect x="1" y="-1" width="0.7" height="2" rx="0.3"/></g></symbol>
    <symbol id="s-bestas" viewBox="-2 -2 4 4" overflow="visible"><g fill="#111"><rect x="-1.95" y="-0.9" width="0.55" height="1.8" rx="0.25"/><rect x="-1.1" y="-0.9" width="0.55" height="1.8" rx="0.25"/><rect x="-0.275" y="-0.9" width="0.55" height="1.8" rx="0.25"/><rect x="0.55" y="-0.9" width="0.55" height="1.8" rx="0.25"/><rect x="1.4" y="-0.9" width="0.55" height="1.8" rx="0.25"/></g></symbol>
  </defs>
  <rect width="210" height="297" fill="#fff"/>
  <rect x="7" y="7" width="196" height="283" fill="none" stroke="#111" stroke-width="0.35"/>

  <!-- Солтүстік көрсеткісі және тақырып (1-кезеңдегідей) -->
  <text x="24" y="18" font-size="5" text-anchor="middle">С</text>
  <polygon points="24,21 24,47 21.4,40" fill="#1f5f99"/><polygon points="24,21 24,47 26.6,40" fill="#4d8fcf"/>
  <circle cx="24" cy="37" r="3.9" fill="none" stroke="#1f5f99" stroke-width="0.4"/>
  <text x="24" y="38.45" font-size="4" text-anchor="middle" font-weight="bold" fill="#fff">N</text>
  <g font-size="4.6"><text x="128" y="20">Мысал қорымы</text><text x="128" y="26">Облыс атауы</text><text x="128" y="32">Аудан атауы</text><text x="128" y="38">Ескерткіш жоспары</text></g>

  <!-- ===== Сызба аймағы (жоғарғы бөлік, y 50–184) ===== -->
  <g stroke="#111">
    <!-- №1 кесене: өлшенген контур, күйдірілген кірпіш -->
    <rect x="52" y="78" width="22" height="22" fill="url(#m-fired)" stroke-width="0.5"/>
    <circle cx="63" cy="89" r="7" fill="none" stroke-width="0.25"/>
    <!-- №2 кесене: шикі кірпіш -->
    <rect x="88" y="70" width="16" height="16" fill="url(#m-raw)" stroke-width="0.5"/>
    <!-- №3 қоршау: өлшенген контур, табиғи тас; ішінде №5, №6 -->
    <rect x="96" y="112" width="38" height="24" fill="none" stroke-width="0.35" stroke-dasharray="1.4 0.9"/>
    <!-- №4 сағана там: шикі кірпіш (ТЗ мысалы), қос сызық -->
    <rect x="140" y="80" width="18" height="12" fill="url(#m-raw)" stroke-width="0.25"/>
    <rect x="141.2" y="81.2" width="15.6" height="9.6" fill="none" stroke-width="0.25"/>
    <!-- №8 сағана там: табиғи тас -->
    <rect x="58" y="128" width="16" height="11" fill="url(#m-stone)" stroke-width="0.25"/>
    <rect x="59.2" y="129.2" width="13.6" height="8.6" fill="none" stroke-width="0.25"/>
  </g>
  <!-- Контурсыз нысандар — белгілер -->
  <use href="#s-kulpytas" x="104" y="120" width="4" height="4" transform="translate(-2 -2)"/>
  <use href="#s-koitas" x="118" y="126" width="4" height="4" transform="translate(-2 -2)"/>
  <use href="#s-kulpytas" x="80" y="150" width="4" height="4" transform="translate(-2 -2)"/>
  <use href="#s-kulpytas" x="150" y="140" width="4" height="4" transform="translate(-2 -2)"/>
  <use href="#s-koitas" x="160" y="152" width="4" height="4" transform="translate(-2 -2)"/>
  <use href="#s-kulpytas" x="40" y="110" width="4" height="4" transform="translate(-2 -2)"/>
  <!-- Нөмірлер -->
  <g font-size="3.6" stroke="#fff" stroke-width="0.8" paint-order="stroke">
    <text x="76" y="80">1</text><text x="106" y="72">2</text><text x="136" y="114">3</text><text x="160" y="82">4</text>
    <text x="107" y="119">5</text><text x="121" y="124">6</text><text x="76" y="130">8</text><text x="83" y="149">7</text>
    <text x="153" y="139">9</text><text x="163" y="150">10</text><text x="43" y="109">11</text>
  </g>

  <!-- ===== Шартты белгілер (төменгі сол жақ) ===== -->
  <line x1="14" y1="190" x2="196" y2="190" stroke="#111" stroke-width="0.2"/>
  <text x="14" y="197" font-size="3.8" font-weight="bold">Шартты белгілер</text>
  <g font-size="3">
    <text x="14" y="203" font-size="2.8" fill="#555">Нысан түрлері</text>
    <use href="#s-kesene" x="16" y="207.5" width="4" height="4" transform="translate(-2 -2)"/><text x="22" y="208.5">кесене</text>
    <use href="#s-sagana" x="16" y="213.5" width="4" height="4" transform="translate(-2 -2)"/><text x="22" y="214.5">сағана там</text>
    <use href="#s-korshau" x="16" y="219.5" width="4" height="4" transform="translate(-2 -2)"/><text x="22" y="220.5">қоршау</text>
    <use href="#s-kulpytas" x="16" y="225.5" width="4" height="4" transform="translate(-2 -2)"/><text x="22" y="226.5">құлпытас</text>
    <use href="#s-koitas" x="16" y="231.5" width="4" height="4" transform="translate(-2 -2)"/><text x="22" y="232.5">қойтас</text>
    <text x="54" y="203" font-size="2.8" fill="#555">Материалдар</text>
    <rect x="54" y="205" width="10" height="6" fill="url(#m-fired)" stroke="#111" stroke-width="0.25"/><text x="66" y="209.3">күйдірілген кірпіш</text>
    <rect x="54" y="213" width="10" height="6" fill="url(#m-raw)" stroke="#111" stroke-width="0.25"/><text x="66" y="217.3">шикі кірпіш</text>
    <rect x="54" y="221" width="10" height="6" fill="url(#m-stone)" stroke="#111" stroke-width="0.25"/><text x="66" y="225.3">табиғи тас</text>
    <rect x="54" y="229" width="10" height="6" fill="#fff" stroke="#111" stroke-width="0.25"/><text x="66" y="233.3">материалы белгісіз</text>
  </g>

  <!-- ===== Экспликация (төменгі оң жақ; жалғасы — келесі бетте) ===== -->
  <g font-size="2.8">
    <text x="98" y="197" font-size="3.8" font-weight="bold">Экспликация</text>
    <g stroke="#111" stroke-width="0.2" fill="none">
      <rect x="98" y="200" width="98" height="61"/>
      <line x1="98" y1="206" x2="196" y2="206"/>
      <line x1="105" y1="200" x2="105" y2="261"/><line x1="124" y1="200" x2="124" y2="261"/>
      <line x1="148" y1="200" x2="148" y2="261"/><line x1="169" y1="200" x2="169" y2="261"/>
    </g>
    <g font-weight="bold"><text x="101.5" y="204.2" text-anchor="middle">№</text><text x="107" y="204.2">Түрі</text><text x="126" y="204.2">Материалы</text><text x="150" y="204.2">Өлшемі, м</text><text x="171" y="204.2">Ескертпе</text></g>
    <g>
      <text x="101.5" y="210.5" text-anchor="middle">1</text><text x="107" y="210.5">Кесене</text><text x="126" y="210.5">Күйдір. кірпіш</text><text x="150" y="210.5">11 × 11; h 6,5</text><text x="171" y="210.5">күмбезі жоқ</text>
      <text x="101.5" y="215.5" text-anchor="middle">2</text><text x="107" y="215.5">Кесене</text><text x="126" y="215.5">Шикі кірпіш</text><text x="150" y="215.5">8 × 8</text><text x="171" y="215.5">—</text>
      <text x="101.5" y="220.5" text-anchor="middle">3</text><text x="107" y="220.5">Қоршау</text><text x="126" y="220.5">Табиғи тас</text><text x="150" y="220.5">19 × 12</text><text x="171" y="220.5">—</text>
      <text x="101.5" y="225.5" text-anchor="middle">4</text><text x="107" y="225.5">Сағана там</text><text x="126" y="225.5">Шикі кірпіш</text><text x="150" y="225.5">9 × 6</text><text x="171" y="225.5">—</text>
      <text x="101.5" y="230.5" text-anchor="middle">5</text><text x="107" y="230.5">Құлпытас</text><text x="126" y="230.5">—</text><text x="150" y="230.5">—</text><text x="171" y="230.5">жазуы бар</text>
      <text x="101.5" y="235.5" text-anchor="middle">6</text><text x="107" y="235.5">Қойтас</text><text x="126" y="235.5">—</text><text x="150" y="235.5">—</text><text x="171" y="235.5">—</text>
      <text x="101.5" y="240.5" text-anchor="middle">7</text><text x="107" y="240.5">Құлпытас</text><text x="126" y="240.5">—</text><text x="150" y="240.5">—</text><text x="171" y="240.5">құлаған</text>
      <text x="101.5" y="245.5" text-anchor="middle">8</text><text x="107" y="245.5">Сағана там</text><text x="126" y="245.5">Табиғи тас</text><text x="150" y="245.5">8 × 5,5</text><text x="171" y="245.5">—</text>
      <text x="101.5" y="250.5" text-anchor="middle">9</text><text x="107" y="250.5">Құлпытас</text><text x="126" y="250.5">—</text><text x="150" y="250.5">—</text><text x="171" y="250.5">—</text>
      <text x="101.5" y="255.5" text-anchor="middle">10</text><text x="107" y="255.5">Қойтас</text><text x="126" y="255.5">—</text><text x="150" y="255.5">—</text><text x="171" y="255.5">—</text>
    </g>
    <text x="196" y="265.5" text-anchor="end" font-size="2.6" font-style="italic" fill="#555">Жалғасы 2-бетте (№11–…)</text>
  </g>

  <!-- Сызықтық масштаб (1-кезеңдегідей) -->
  <g>
    <rect x="135" y="282" width="55" height="1.3" fill="#fff" stroke="#111" stroke-width="0.25"/>
    <rect x="135" y="282" width="11" height="1.3"/><rect x="157" y="282" width="11" height="1.3"/><rect x="179" y="282" width="11" height="1.3"/>
    <g font-size="3" text-anchor="middle"><text x="135" y="280.4">0</text><text x="146" y="280.4">5</text><text x="168" y="280.4">15</text><text x="190" y="280.4">25</text></g>
    <text x="192.2" y="280.4" font-size="3">м</text>
  </g>
</svg>
